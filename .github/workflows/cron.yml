name: Process Notifications & Automations Cron

on:
  schedule:
    # Runs every 5 minutes (standard minimum GitHub Actions interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  cron:
    name: Ping Notification Worker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Notification Queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'wow-local-cron' }}
          APP_URL: ${{ secrets.APP_URL || 'https://www.wowexperience.com.ng' }}
        run: |
          echo "Pinging notification worker at $APP_URL/api/cron/notifications..."
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/notifications")
          
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Worker executed successfully."
            exit 0
          else
            echo "Worker failed with status $HTTP_STATUS"
            exit 1
          fi
